<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paderborn Wetter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PB Wetter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1b24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1b24'/%3E%3Cpath d='M18 40a10 10 0 0 1 2-19.8A13 13 0 0 1 45 24a8 8 0 0 1 1 16z' fill='%23dfe8ee'/%3E%3Cpath d='M24 46l-3 7M33 46l-3 7M42 46l-3 7' stroke='%234fb3ff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: Radar oben als Hauptfläche, darunter 5 Stunden-Kacheln und ein Viertelstunden-Regenband */
:root{
  --bg:#eef2f5; --panel:#ffffff; --fg:#14222d; --muted:#5d6f7c; --line:#d5dee5;
  --rain:#2a8fe0; --accent:#0e6fbf; --warn:#c0392b;
  --sun:#f2a516; --cloud:#9aabb8; --cloud2:#c9d4dc;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1b24; --panel:#172733; --fg:#e4ecf1; --muted:#8fa3b1; --line:#24384a;
    --rain:#4fb3ff; --accent:#6cc0ff; --warn:#ff7a6b;
    --sun:#ffbe3d; --cloud:#9fb2c0; --cloud2:#5f7586; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:1.35rem;margin:0;letter-spacing:.01em}
.now{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.now b{color:var(--fg);font-size:1.15rem}
#map{height:min(52vh,420px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.8rem;margin-top:-6px;flex-wrap:wrap}
.meta a{color:var(--accent)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:4px 0 -4px}
.hours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.h{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 2px 10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.h .t{font-size:.85rem;color:var(--muted)}
.h svg{width:44px;height:44px}
.h .tmp{font-weight:700;font-size:1.05rem}
.h .pr{font-size:.75rem;color:var(--rain);min-height:1em}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.bars{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;align-items:end;height:64px;
  border-bottom:1px solid var(--line)}
.bars i{display:block;background:var(--rain);border-radius:2px 2px 0 0;min-height:1px;opacity:.9}
.bars i.dry{background:var(--line)}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);font-size:.72rem;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.summary{font-size:.9rem;margin:0 0 8px}
.err{color:var(--warn);font-size:.9rem}
footer{color:var(--muted);font-size:.72rem;line-height:1.4}
footer a{color:var(--muted)}
button{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.leaflet-container{background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Paderborn</h1>
    <div class="now" id="now">lädt …</div>
  </header>

  <div id="map" role="img" aria-label="Niederschlagsradar des DWD rund um Paderborn"></div>
  <div class="meta">
    <span id="radarTime">Radar: aktuellster DWD-Stand</span>
    <button id="reload" type="button">Aktualisieren</button>
  </div>

  <h2>Nächste 5 Stunden</h2>
  <div class="hours" id="hours"></div>

  <h2>Regen in 15-Minuten-Schritten</h2>
  <div class="strip">
    <p class="summary" id="summary"></p>
    <div class="bars" id="bars"></div>
    <div class="ticks" id="ticks"></div>
  </div>

  <p class="err" id="err" hidden></p>

  <footer>
    Radar: Deutscher Wetterdienst (DWD), Geodienst maps.dwd.de. Vorhersage: DWD-Modell ICON (D2 / EU), bereitgestellt über
    <a href="https://open-meteo.com/">Open-Meteo</a>. Karte © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
    Aktualisiert sich alle 5 Minuten.
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LAT = 51.7189, LON = 8.7575;

/* ---------- Radar ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([LAT, LON], 9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 13 }).addTo(map);
let radar = makeRadar();
function makeRadar(){
  return L.tileLayer.wms('https://maps.dwd.de/geoserver/dwd/wms', {
    layers: 'dwd:Niederschlagsradar', format: 'image/png', transparent: true,
    version: '1.3.0', opacity: 0.75, _t: Date.now()
  }).addTo(map);
}
L.circleMarker([LAT, LON], { radius: 6, color: '#ffffff', weight: 2, fillColor: '#e0452c', fillOpacity: 1 }).addTo(map);

function refreshRadar(){
  map.removeLayer(radar); radar = makeRadar();
  const t = new Date();
  document.getElementById('radarTime').textContent =
    'Radar geladen ' + t.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
}

/* ---------- Symbole (WMO-Wettercode) ---------- */
const C = { sun:'var(--sun)', cl:'var(--cloud)', cl2:'var(--cloud2)', r:'var(--rain)' };
const sunG  = (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle r="7" fill="${C.sun}"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="0" y1="-10" x2="0" y2="-13" stroke="${C.sun}" stroke-width="2.2" stroke-linecap="round" transform="rotate(${a})"/>`).join('')}</g>`;
const moonG = (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M4 -9a10 10 0 1 0 6 15a8 8 0 0 1 -6 -15z" fill="${C.cl2}"/></g>`;
const cloudG= (x,y,s,f)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 8a7 7 0 0 1 1-14a10 10 0 0 1 19-2a7.5 7.5 0 0 1 9 8a6 6 0 0 1 -1 8z" fill="${f||C.cl}"/></g>`;
const drops = n=>[...Array(n)].map((_,i)=>`<line x1="${16+i*8}" y1="36" x2="${13+i*8}" y2="43" stroke="${C.r}" stroke-width="2.6" stroke-linecap="round"/>`).join('');
const flakes= n=>[...Array(n)].map((_,i)=>`<circle cx="${16+i*8}" cy="40" r="2.3" fill="${C.cl2}" stroke="${C.cl}" stroke-width=".8"/>`).join('');
const bolt  = `<path d="M26 32l-4 8h5l-3 7 8-10h-5l3-5z" fill="${C.sun}"/>`;
const fog   = [30,35,40].map(y=>`<line x1="10" y1="${y}" x2="38" y2="${y}" stroke="${C.cl}" stroke-width="2.6" stroke-linecap="round"/>`).join('');

function icon(code, day){
  const sky = day ? sunG(18,16,1) : moonG(18,16,1);
  let b;
  if (code === 0) b = day ? sunG(24,24,1.3) : moonG(24,24,1.3);
  else if (code === 1) b = sky + cloudG(30,28,.7,C.cl2);
  else if (code === 2) b = sky + cloudG(28,28,.95);
  else if (code === 3) b = cloudG(22,22,.9,C.cl2) + cloudG(26,28,1);
  else if (code === 45 || code === 48) b = cloudG(24,20,.9) + fog;
  else if (code >= 51 && code <= 57) b = cloudG(24,24,1) + drops(2);
  else if ((code >= 61 && code <= 67)) b = cloudG(24,24,1) + drops(code >= 63 ? 3 : 2);
  else if (code >= 80 && code <= 82) b = (day?sunG(14,14,.8):moonG(14,14,.8)) + cloudG(26,26,1) + drops(3);
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) b = cloudG(24,24,1) + flakes(3);
  else if (code >= 95) b = cloudG(24,24,1) + bolt;
  else b = cloudG(24,26,1);
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${b}</svg>`;
}
const TEXT = c => c===0?'klar':c<=2?'heiter':c===3?'bedeckt':c<=48?'Nebel':c<=57?'Niesel':c<=67?'Regen':c<=77?'Schnee':c<=82?'Schauer':c<=86?'Schneeschauer':'Gewitter';

/* ---------- Vorhersage ---------- */
const URL_API = 'https://api.open-meteo.com/v1/dwd-icon?latitude=' + LAT + '&longitude=' + LON +
  '&current=temperature_2m,weather_code,is_day' +
  '&hourly=temperature_2m,weather_code,precipitation,is_day' +
  '&minutely_15=precipitation' +
  '&timezone=Europe%2FBerlin&forecast_days=2';

const hm = s => s.slice(11,16);

async function loadForecast(){
  const err = document.getElementById('err');
  try{
    const r = await fetch(URL_API, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    err.hidden = true;

    // aktuell
    const c = d.current;
    document.getElementById('now').innerHTML =
      `<b>${Math.round(c.temperature_2m)}°</b> ${TEXT(c.weather_code)}`;

    // nächste 5 volle Stunden (ab der kommenden Stunde)
    const nowIso = c.time.slice(0,13);           // "YYYY-MM-DDTHH"
    const h = d.hourly;
    let i0 = h.time.findIndex(t => t.slice(0,13) > nowIso);
    if (i0 < 0) i0 = 0;
    let html = '';
    for (let i = i0; i < i0 + 5 && i < h.time.length; i++){
      const p = h.precipitation[i];
      html += `<div class="h" title="${TEXT(h.weather_code[i])}">
        <span class="t">${hm(h.time[i])}</span>
        ${icon(h.weather_code[i], h.is_day[i] === 1)}
        <span class="tmp">${Math.round(h.temperature_2m[i])}°</span>
        <span class="pr">${p >= 0.1 ? p.toFixed(1).replace('.',',') + ' mm' : ''}</span>
      </div>`;
    }
    document.getElementById('hours').innerHTML = html;

    // 15-Minuten-Regen, nächste 5 Stunden (20 Werte)
    const m = d.minutely_15;
    const nowMs = Date.now();
    let j0 = m.time.findIndex(t => new Date(t + ':00').getTime() + 15*60e3 > nowMs);
    if (j0 < 0) j0 = 0;
    const vals = m.precipitation.slice(j0, j0 + 20).map(v => v ?? 0);
    const times = m.time.slice(j0, j0 + 20);
    const MAX = Math.max(1, ...vals);              // Skala mindestens 1 mm / 15 min
    document.getElementById('bars').innerHTML = vals.map((v,k) =>
      `<i class="${v < 0.05 ? 'dry' : ''}" style="height:${v < 0.05 ? 2 : Math.max(6, v / MAX * 100)}%" title="${hm(times[k])}: ${v.toFixed(1)} mm"></i>`).join('');
    document.getElementById('ticks').innerHTML = [0,4,8,12,16].map(k => `<span>${times[k] ? hm(times[k]) : ''}</span>`).join('');

    const first = vals.findIndex(v => v >= 0.1);
    const sum = vals.reduce((a,b) => a + b, 0);
    document.getElementById('summary').textContent =
      first < 0 ? 'Kein nennenswerter Regen in den nächsten 5 Stunden.'
      : first === 0 ? `Regen jetzt, zusammen etwa ${sum.toFixed(1).replace('.',',')} mm in 5 Stunden.`
      : `Regen ab etwa ${hm(times[first])} Uhr, zusammen etwa ${sum.toFixed(1).replace('.',',')} mm.`;
  }catch(e){
    err.hidden = false;
    err.textContent = 'Vorhersage konnte nicht geladen werden. Bitte Internetverbindung prüfen und „Aktualisieren“ tippen.';
  }
}

function refreshAll(){ refreshRadar(); loadForecast(); }
document.getElementById('reload').addEventListener('click', refreshAll);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });
setInterval(refreshAll, 5 * 60e3);
refreshAll();
</script>
</body>
</html>
